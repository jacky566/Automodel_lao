# Short low-learning-rate joint stage after head-only Domino training.

recipe: TrainDominoRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /data/models/Qwen2.5-VL-7B-Instruct
  draft_init_from: domino_matched_stage1_checkpoints/epoch_4_step_200/model/consolidated
  training_stage: joint
  output_dir: domino_matched_stage2
  num_epochs: 10
  max_steps: 200

  seq_length: 2048
  image_min_pixels: 200704
  image_max_pixels: 1003520
  micro_batch_size: 28
  grad_accumulation_steps: 1
  num_workers: 4

  draft_num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention

  emb_dim: 256
  gru_hidden_dim: 1024
  pure_draft_prefix_len: 1
  shift_label: false
  lambda_base_start: 0.5
  lambda_base_decay_ratio: 1.0

  trust_remote_code: false
  target_attn_implementation: sdpa
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  ckpt_every_steps: 200

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: training_data/dflash_matched_vlm_target/meta.json
  split: train

optimizer:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: domino_matched_stage2_checkpoints
  model_save_format: safetensors
  save_consolidated: every
  max_recent_checkpoints: 1

wandb:
  enable: false
  project: domino-qwen2-5-vl
  name: qwen2-5-vl-domino-matched-stage2
  mode: offline
  dir: domino_matched_stage2/wandb
