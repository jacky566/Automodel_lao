# Direct-MRoPE continuation controlled against matched DFlash step 400.

recipe: TrainDFlashRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /data/models/Qwen2.5-VL-7B-Instruct
  draft_init_from: checkpoints/epoch_6_step_14574/model/consolidated
  training_stage: joint
  spatial_rope_enabled: true
  spatial_rope_mode: replace
  spatial_rope_sections: [16, 24, 24]
  output_dir: dflash_hard_mrope_400step
  num_epochs: 20
  max_steps: 400

  seq_length: 2048
  image_min_pixels: 200704
  image_max_pixels: 1003520
  micro_batch_size: 28
  grad_accumulation_steps: 1
  num_workers: 4

  draft_num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention

  trust_remote_code: false
  target_attn_implementation: sdpa
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  ckpt_every_steps: 200

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: training_data/dflash_matched_vlm_target/meta.json
  split: train

optimizer:
  lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.05
  min_lr_ratio: 0.1

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: dflash_hard_mrope_400step_checkpoints
  model_save_format: safetensors
  save_consolidated: every
  max_recent_checkpoints: 2

wandb:
  enable: false
  project: dflash-qwen2-5-vl
  name: qwen2-5-vl-dflash-hard-mrope-400step
  mode: offline
  dir: dflash_hard_mrope_400step/wandb
