# Domino draft training for the Qwen2.5-VL-7B target. All shared training,
# data, optimizer, batching, and checkpoint-cadence parameters match
# qwen2_5_vl_dflash.yaml. Domino adds only its causal correction head and
# base-anchor curriculum. Training starts from a fresh draft checkpoint.

recipe: TrainDominoRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /data/models/Qwen2.5-VL-7B-Instruct
  output_dir: /data/runs/domino_qwen2_5_vl_7b
  seq_length: 3072
  image_min_pixels: 200704
  image_max_pixels: 1003520
  micro_batch_size: 28
  grad_accumulation_steps: 1
  num_workers: 4
  num_epochs: 6

  # DFlash backbone: identical to yesterday's Qwen2.5-VL DFlash run.
  draft_num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention

  # Domino causal correction head.
  emb_dim: 256
  gru_hidden_dim: 1024
  pure_draft_prefix_len: 1
  shift_label: true

  # Linearly decay the backbone-only loss weight from 1 to 0 over training.
  lambda_base_start: 1.0
  lambda_base_decay_ratio: 1.0

  trust_remote_code: false
  target_attn_implementation: sdpa
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  ckpt_every_steps: 2000

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /data/datasets/vispec_qwen2_5_vl/stage2/meta.json
  split: train

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

compile:
  enabled: true
  mode: default

checkpoint:
  enabled: true
  checkpoint_dir: /data/runs/domino_qwen2_5_vl_7b/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

wandb:
  enable: false
  project: domino-qwen2-5-vl
  name: qwen2-5-vl-7b-domino-bs28-a256
  mode: offline
  dir: /data/runs/domino_qwen2_5_vl_7b/wandb
