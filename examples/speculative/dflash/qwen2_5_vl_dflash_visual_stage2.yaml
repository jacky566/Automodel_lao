# Stage 2: jointly fine-tune the DFlash backbone and two-query visual adaptor
# for one complete pass over the reshuffled dataset.

recipe: TrainDFlashRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /data/models/Qwen2.5-VL-7B-Instruct
  # The sequential launcher overrides this with the actual final Stage 1 path.
  draft_init_from: dflash_visual_stage1_checkpoints/epoch_1_step_2429/model/consolidated
  output_dir: dflash_visual_stage2
  training_stage: joint
  num_epochs: 1

  seq_length: 3072
  image_min_pixels: 200704
  image_max_pixels: 1003520
  micro_batch_size: 28
  grad_accumulation_steps: 1
  num_workers: 4

  draft_num_hidden_layers: 3
  block_size: 8
  num_anchors: 256
  loss_decay_gamma: 7.0
  mask_token_id: 151669
  attention_backend: flex_attention
  visual_num_query_tokens: 2
  visual_adapter_dim: 256
  visual_num_attention_heads: 4
  visual_gate_init: 1.0e-3

  trust_remote_code: false
  target_attn_implementation: sdpa
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  ckpt_every_steps: 1000

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /data/datasets/vispec_qwen2_5_vl/stage2/meta.json
  split: train

optimizer:
  lr: 1.0e-4
  backbone_lr: 1.0e-4
  visual_lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

compile:
  enabled: true
  mode: default

checkpoint:
  enabled: true
  checkpoint_dir: dflash_visual_stage2_checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

wandb:
  enable: false
  project: dflash-qwen2-5-vl
  name: qwen2-5-vl-dflash-visual-stage2-q2
  mode: offline
  dir: dflash_visual_stage2/wandb
