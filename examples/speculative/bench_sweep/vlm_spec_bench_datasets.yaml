datasets:
  - name: scienceqa
    input_data: lmms-lab/ScienceQA
    dataset_name: ScienceQA-IMG
    split: test
    benchmark_adapter: scienceqa
    max_new_tokens: 512

  - name: mmvet
    input_data: whyu/mm-vet
    split: test
    benchmark_adapter: mmvet
    max_new_tokens: 512

  - name: textvqa
    input_data: lmms-lab/textvqa
    split: validation
    benchmark_adapter: textvqa
    max_new_tokens: 512

  - name: coco_caption
    input_data: lmms-lab/COCO-Caption2017
    split: val
    benchmark_adapter: coco_caption
    max_new_tokens: 512
